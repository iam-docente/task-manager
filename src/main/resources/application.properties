# ============================================================
# Identidad de la aplicación
# ============================================================
spring.application.name=task-manager


# ============================================================
# Base de datos H2 (en memoria) - solo para desarrollo y tests
# ============================================================
# La BD vive mientras la app esté corriendo. Al apagarla, se borra.
# Esto es intencional: no queremos datos persistentes en desarrollo.
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ============================================================
# JPA / Hibernate
# ============================================================
# create-drop: crea las tablas al arrancar, las borra al apagar.
# Útil en desarrollo: cada reinicio parte de cero.
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra las queries SQL en consola (útil para aprender qué hace Hibernate)
spring.jpa.show-sql=true


# ============================================================
# Consola web H2 (http://localhost:8088/h2-console)
# ============================================================
# Permite explorar la BD desde el navegador. NUNCA en producción.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ============================================================
# Actuator: endpoints de monitoreo (usado por Docker HEALTHCHECK)
# ============================================================
# Solo exponemos health e info. Exponer todos los endpoints
# (management.endpoints.web.exposure.include=*) es un riesgo de seguridad.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ============================================================
# Servidor HTTP
# ============================================================
server.port=8088
