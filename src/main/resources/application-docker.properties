# ============================================================
# application-docker.properties
# Configuración activa SOLO cuando SPRING_PROFILES_ACTIVE=docker
# Sobrescribe los valores definidos en application.properties
# ============================================================

# ------------------------------------------------------------
# Base de datos PostgreSQL
# ------------------------------------------------------------
# El host "db" es el nombre del servicio en docker-compose.yml.
# Docker Compose crea una red interna donde los servicios se
# resuelven por su nombre. "db" → contenedor "task-manager-db".
#
# Los valores por defecto (${...}) permiten sobrescribir desde
# variables de entorno sin modificar este archivo. Esto es clave
# para no hardcodear credenciales (buena práctica DevOps).
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}


# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
# update: en producción real se usaría "validate" y las migraciones
# se manejarían con Flyway o Liquibase. Para esta demo, "update"
# permite que Hibernate ajuste el esquema automáticamente.
spring.jpa.hibernate.ddl-auto=update

# Desactivamos el log de SQL: en producción genera ruido y ralentiza.
spring.jpa.show-sql=false

# Dialecto específico de PostgreSQL (evita warnings de Hibernate).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ------------------------------------------------------------
# Consola H2: deshabilitada (no aplica con PostgreSQL)
# ------------------------------------------------------------
spring.h2.console.enabled=false


# ------------------------------------------------------------
# Actuator: health checks (usado por Docker/K8s)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ------------------------------------------------------------
# Servidor HTTP
# ------------------------------------------------------------
server.port=8088
