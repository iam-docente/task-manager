# ============================================================
# sonar-project.properties
# Configuración de SonarQube/SonarCloud para el análisis estático
# ============================================================

# ------------------------------------------------------------
# Identidad del proyecto (deben coincidir con SonarCloud)
# ------------------------------------------------------------
sonar.projectKey=task-manager-demo
sonar.organization=task-manager-demo
sonar.projectName=Task Manager API
sonar.projectVersion=1.0.0

# ------------------------------------------------------------
# Código fuente y tests
# ------------------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# ------------------------------------------------------------
# Cobertura de pruebas (generada por JaCoCo)
# ------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ------------------------------------------------------------
# Exclusiones (código que NO se analiza)
# ------------------------------------------------------------
# Excluimos DTOs (solo getters/setters) y la clase Main (trivial).
# Esto evita que Sonar penalice la cobertura por código no testeable.
sonar.exclusions=**/dto/**, **/exception/**, **/TaskManagerApplication.java

# ------------------------------------------------------------
# Encoding
# ------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------
# Quality Gate
# ------------------------------------------------------------
# Umbral mínimo de cobertura. Si baja de 70%, el pipeline falla.
sonar.qualitygate.wait=true
